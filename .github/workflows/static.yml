# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file page
        run: npm ci && npm run build
        env:
          # The page names the commit it was built from in a hidden meta tag, for the check below.
          DCN_BUILD: ${{ github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the built page; source, docs and tests stay in the repo
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the live page is this commit
        # A deploy that "succeeds" but leaves an older page live fails here,
        # instead of being noticed by someone looking for a new feature.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sha="${GITHUB_SHA::7}"
          for attempt in $(seq 1 20); do
            page="$(curl -fsSL "${PAGE_URL}?build=${sha}" || true)"
            if grep -q "name=\"dcn-build\" content=\"${sha} " <<< "${page}"; then
              echo "The live page was built from ${sha}."
              exit 0
            fi
            sleep 15
          done
          echo "After five minutes the live page is still not ${sha}."
          curl -fsSL "${PAGE_URL}?build=${sha}" | grep -o 'name="dcn-build" content="[^"]*"' || echo "It carries no build stamp."
          exit 1
